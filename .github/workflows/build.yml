name: Build apps

# Builds an installable Android APK and an iOS app on GitHub's machines.
# Nothing is published to App Store or Google Play.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx jest --ci

  android:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
      - run: npm ci
      - name: Generate native Android project
        run: npx expo prebuild --platform android --no-install
        env: { EXPO_NO_TELEMETRY: 1 }
      - name: Build release APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a,armeabi-v7a
      - name: Rename APK
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/release/app-release.apk out/Runstart-${{ github.run_number }}.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Runstart-android-apk
          path: out/*.apk
          retention-days: 30

  ios:
    needs: test
    runs-on: macos-26
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: maxim-lobanov/setup-xcode@v1
        with: { xcode-version: latest }
      - run: xcodebuild -version && ls /Applications | grep -i xcode
      - run: npm ci
      - name: Older Xcode (< 26.6) – compatibility fix for one line in ExpoModulesJSI
        run: |
          v=$(xcodebuild -version | head -1 | awk '{print $2}')
          if [ "$(printf '%s\n' 26.6 "$v" | sort -V | head -1)" != "26.6" ]; then python3 scripts/ci-xcode-compat.py; else echo "Xcode $v: no change needed"; fi
      - name: Generate native iOS project (incl. CocoaPods)
        run: npx expo prebuild --platform ios
        env: { EXPO_NO_TELEMETRY: 1 }
      - name: Build unsigned device app
        run: |
          set -o pipefail
          xcodebuild -workspace ios/Runstart.xcworkspace -scheme Runstart -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" > xcodebuild-device.log 2>&1 \
            || { grep -n -B2 -A12 -E "error:|failed with exit code|\*\* BUILD FAILED" xcodebuild-device.log | tail -n 300; exit 1; }
          tail -n 5 xcodebuild-device.log
      - name: Package unsigned IPA
        run: |
          mkdir -p out/Payload
          cp -R build/Build/Products/Release-iphoneos/Runstart.app out/Payload/
          (cd out && zip -qry Runstart-${{ github.run_number }}-unsigned.ipa Payload)
      - name: Build simulator app
        run: |
          set -o pipefail
          xcodebuild -workspace ios/Runstart.xcworkspace -scheme Runstart -configuration Release \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath build-sim \
            CODE_SIGNING_ALLOWED=NO | tail -n 50
          (cd build-sim/Build/Products/Release-iphonesimulator && zip -qry ../../../../out/Runstart-${{ github.run_number }}-simulator.app.zip Runstart.app)
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: ios-build-logs
          path: xcodebuild-*.log
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: Runstart-ios
          path: |
            out/*.ipa
            out/*.app.zip
          retention-days: 30

  publish:
    # Puts the finished apps as zip files on the "builds" branch of this repo.
    needs: [android, ios]
    if: ${{ always() && (needs.android.result == 'success' || needs.ios.result == 'success') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with: { path: dist, pattern: Runstart-* }
      - name: Zip the apps
        run: |
          mkdir -p zips
          n=${{ github.run_number }}
          if [ -d dist/Runstart-android-apk ]; then (cd dist/Runstart-android-apk && zip -q ../../zips/Runstart-android-$n.zip *.apk); fi
          if [ -d dist/Runstart-ios ]; then (cd dist/Runstart-ios && zip -q ../../zips/Runstart-ios-$n.zip *); fi
          ls -la zips
      - name: Commit to the builds branch
        env:
          REPO: https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git
        run: |
          if git clone -q --depth 1 --branch builds "$REPO" out 2>/dev/null; then :; else
            mkdir out && cd out && git init -q -b builds && git remote add origin "$REPO" && cd ..
          fi
          cd out
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          # keep the previous platform zip if this run could not build it
          for p in android ios; do
            if ls ../zips/Runstart-$p-*.zip >/dev/null 2>&1; then git rm -q --ignore-unmatch "Runstart-$p-*.zip"; cp ../zips/Runstart-$p-*.zip .; fi
          done
          if ls ../zips/Runstart-ios-*.zip >/dev/null 2>&1; then echo -n "${{ github.sha }}" > IOS_COMMIT; fi
          printf '%s\n' "# Runstart – færdige app-filer" "" \
            "Bygget fra commit ${{ github.sha }} (kørsel ${{ github.run_number }})." "" \
            "- **Runstart-android-*.zip** – pak ud og installér APK'en på Android." \
            "- **Runstart-ios-*.zip** – usigneret .ipa (signeres fx med Sideloadly/AltStore) og .app.zip til iOS-simulatoren." "" \
            "Ikke udgivet i App Store eller Google Play." > README.md
          git add -A
          git commit -q -m "Apps from run ${{ github.run_number }} (${{ github.sha }})"
          git push -q origin builds

name: Build apps

# Builds an installable Android APK and an iOS app on GitHub's machines.
# Nothing is published to App Store or Google Play.
on:
  push:
    branches: [main, mette-edition]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx jest --ci

  android:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
      - run: npm ci
      - name: Generate native Android project
        run: npx expo prebuild --platform android --no-install
        env: { EXPO_NO_TELEMETRY: 1 }
      - name: Build release APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a,armeabi-v7a
      - name: Rename APK
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/release/app-release.apk out/Runstart-Mette-${{ github.run_number }}.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Runstart-Mette-android-apk
          path: out/*.apk
          retention-days: 30

  publish:
    # Puts the finished apps as zip files on the "builds-mette" branch of this repo.
    needs: [android]
    if: ${{ always() && needs.android.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with: { path: dist, pattern: Runstart-Mette-* }
      - name: Zip the apps
        run: |
          mkdir -p zips
          n=${{ github.run_number }}
          if [ -d dist/Runstart-Mette-android-apk ]; then (cd dist/Runstart-Mette-android-apk && zip -q ../../zips/Runstart-Mette-android-$n.zip *.apk); fi
          ls -la zips
      - name: Commit to the builds branch
        env:
          REPO: https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git
        run: |
          if git clone -q --depth 1 --branch builds-mette "$REPO" out 2>/dev/null; then :; else
            mkdir out && cd out && git init -q -b builds-mette && git remote add origin "$REPO" && cd ..
          fi
          cd out
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          # keep the previous platform zip if this run could not build it
          for p in android; do
            if ls ../zips/Runstart-Mette-$p-*.zip >/dev/null 2>&1; then git rm -q --ignore-unmatch "Runstart-Mette-$p-*.zip"; cp ../zips/Runstart-Mette-$p-*.zip .; fi
          done
          printf '%s\n' "# Runstart Mette Edition – APK til Android" "" \
            "Bygget fra commit ${{ github.sha }} (kørsel ${{ github.run_number }})." "" \
            "- **Runstart-Mette-android-*.zip** – pak ud og installér APK'en på Android." \
            "Ikke udgivet i App Store eller Google Play." > README.md
          git add -A
          git commit -q -m "Apps from run ${{ github.run_number }} (${{ github.sha }})"
          git push -q origin builds-mette

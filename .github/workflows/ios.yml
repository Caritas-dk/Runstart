name: Build iOS (any Mac)

# Manual iOS build that can run on another macOS runner type when the
# default one is busy. Puts the zipped app on the "builds" branch.
on:
  workflow_dispatch:
    inputs:
      runner:
        description: macOS runner label
        default: macos-15-intel
        type: choice
        options: [macos-26, macos-15, macos-latest, macos-26-intel, macos-15-intel]

concurrency:
  group: ios-build
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.c.outputs.build }}
    steps:
      - id: c
        env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          built=$(gh api "repos/${{ github.repository }}/contents/IOS_COMMIT?ref=builds" --jq .content 2>/dev/null | base64 -d 2>/dev/null || true)
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || [ "$built" != "${{ github.sha }}" ]; then
            echo "build=true" >> "$GITHUB_OUTPUT"; echo "iOS app needed for ${{ github.sha }} (have: ${built:-none})"
          else
            echo "build=false" >> "$GITHUB_OUTPUT"; echo "iOS app already built for ${{ github.sha }}"
          fi

  ios:
    needs: check
    if: needs.check.outputs.build == 'true'
    runs-on: ${{ inputs.runner || 'macos-15-intel' }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: maxim-lobanov/setup-xcode@v1
        with: { xcode-version: latest }
      - run: xcodebuild -version && ls /Applications | grep -i xcode
      - run: npm ci
      - name: Older Xcode (< 26.6) – compatibility fix for one line in ExpoModulesJSI
        run: |
          v=$(xcodebuild -version | head -1 | awk '{print $2}')
          if [ "$(printf '%s\n' 26.6 "$v" | sort -V | head -1)" != "26.6" ]; then
            echo "Xcode $v"; python3 scripts/ci-xcode-compat.py
          else
            echo "Xcode $v: no change needed"
          fi
      - name: Generate native iOS project (incl. CocoaPods)
        run: npx expo prebuild --platform ios
        env: { EXPO_NO_TELEMETRY: 1 }
      - name: Build unsigned device app
        run: |
          set -o pipefail
          xcodebuild -workspace ios/Runstart.xcworkspace -scheme Runstart -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" > xcodebuild-device.log 2>&1 \
            || { grep -n -B2 -A12 -E "error:|failed with exit code|\*\* BUILD FAILED" xcodebuild-device.log | tail -n 300; exit 1; }
          tail -n 5 xcodebuild-device.log
      - name: Package unsigned IPA
        run: |
          mkdir -p out/Payload
          cp -R build/Build/Products/Release-iphoneos/Runstart.app out/Payload/
          (cd out && zip -qry Runstart-${{ github.run_number }}-unsigned.ipa Payload)
      - name: Build simulator app
        run: |
          set -o pipefail
          xcodebuild -workspace ios/Runstart.xcworkspace -scheme Runstart -configuration Release \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath build-sim \
            CODE_SIGNING_ALLOWED=NO | tail -n 50
          (cd build-sim/Build/Products/Release-iphonesimulator && zip -qry ../../../../out/Runstart-${{ github.run_number }}-simulator.app.zip Runstart.app)
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: ios-build-logs
          path: xcodebuild-*.log
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: Runstart-ios
          path: |
            out/*.ipa
            out/*.app.zip
          retention-days: 30

  publish:
    needs: ios
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with: { name: Runstart-ios, path: ios }
      - name: Commit the iOS zip to the builds branch
        env:
          REPO: https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git
        run: |
          (cd ios && zip -q ../Runstart-ios-${{ github.run_number }}.zip *)
          if git clone -q --depth 1 --branch builds "$REPO" out 2>/dev/null; then :; else
            mkdir out && cd out && git init -q -b builds && git remote add origin "$REPO" && cd ..
          fi
          cd out
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git rm -q --ignore-unmatch "Runstart-ios-*.zip"
          cp ../Runstart-ios-${{ github.run_number }}.zip "Runstart-ios-m${{ github.run_number }}.zip"
          echo -n "${{ github.sha }}" > IOS_COMMIT
          git add -A
          git commit -q -m "iOS app from run ${{ github.run_number }} (${{ github.sha }})"
          git push -q origin builds
